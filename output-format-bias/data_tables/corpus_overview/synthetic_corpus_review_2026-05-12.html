  <style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body {

/* ── Header ── */

.header-btns { display: flex; gap: 0.5rem; flex-shrink: 0; }
.btn {
  font-family: 'Courier New', monospace;
  font-size: 0.75rem;
  padding: 0.3rem 0.7rem;
  border: 1px solid #555;
  background: #333;
  color: #eee;
  cursor: pointer;
  border-radius: 3px;
}
.btn:hover { background: #444; }
.btn-collapse { border-color: #777; }

/* ── Sticky nav ── */
.sticky-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #f0ede4;
  border-bottom: 1px solid #ccc;
  padding: 0.5rem 1rem;
}
.nav-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
  margin-bottom: 0.3rem;
}
.nav-row:last-child { margin-bottom: 0; }
.nav-label {
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: #666;
  align-self: center;
  margin-right: 0.25rem;
  white-space: nowrap;
}
.chip {
  font-family: 'Courier New', monospace;
  font-size: 0.7rem;
  padding: 0.15rem 0.45rem;
  border-radius: 3px;
  cursor: pointer;
  border: 1px solid transparent;
  user-select: none;
  white-space: nowrap;
  color: #fff;
  font-weight: bold;
}
.chip:hover { opacity: 0.85; transform: scale(1.05); }

/* ── Filter bar ── */
.filter-bar {
  background: #e8e4da;
  padding: 0.4rem 1rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  align-items: center;
  border-bottom: 1px solid #ccc;
}
.filter-label {
  font-family: 'Courier New', monospace;
  font-size: 0.7rem;
  color: #555;
  margin-right: 0.3rem;
}
.filter-btn {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  padding: 0.2rem 0.6rem;
  border: 1px solid #bbb;
  background: #fff;
  color: #444;
  cursor: pointer;
  border-radius: 12px;
}
.filter-btn:hover { background: #f0ede4; }
.filter-btn.active {
  background: #222;
  color: #fff;
  border-color: #222;
}

/* ── Section headers ── */
.corpus-section-header {
  padding: 0.6rem 1.5rem 0.4rem;
  font-family: 'Courier New', monospace;
  font-size: 0.8rem;
  color: #555;
  background: #edeae0;
  border-bottom: 1px solid #ccc;
  border-top: 2px solid #bbb;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ── Cards ── */
.card {
  border-left: 5px solid #ccc;
  border-bottom: 1px solid #e0ddd4;
  background: #fff;
  transition: background 0.1s;
}
.card:hover { background: #fdfcf8; }
.card.hidden { display: none; }
.card.reviewed { opacity: 0.55; }
.card.reviewed .card-name { text-decoration: line-through; text-decoration-color: #aaa; }

/* Reviewed checkbox in card head */
.reviewed-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-family: 'Courier New', monospace;
  font-size: 0.68rem;
  color: #888;
  flex-shrink: 0;
  cursor: pointer;
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
}
.reviewed-toggle:hover { background: #f0ede4; color: #333; }
.reviewed-toggle input { margin: 0; cursor: pointer; }

/* Progress counter in header */
.progress-counter {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  color: #666;
  background: #f0ede4;
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  white-space: nowrap;
}
.progress-counter .pc-num { font-weight: bold; color: #2f9e44; }

/* ── Card header (collapsed view) ── */
.card-head {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 1rem 0.6rem 1.25rem;
  cursor: pointer;
  user-select: none;
}
.card-head:hover .id-chip { opacity: 0.8; }
.id-chip {
  font-family: 'Courier New', monospace;
  font-size: 0.72rem;
  font-weight: bold;
  padding: 0.15rem 0.45rem;
  border-radius: 3px;
  color: #fff;
  white-space: nowrap;
  flex-shrink: 0;
}
.card-name {
  font-weight: bold;
  font-size: 0.92rem;
  flex-shrink: 0;
}
.card-pattern-summary {
  font-size: 0.8rem;
  color: #555;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wc-badge {
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: #888;
  background: #f0f0f0;
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
  flex-shrink: 0;
}
/* Editable verdict dropdown — styled to look like a colored pill */
.verdict-select {
  font-family: 'Courier New', monospace;
  font-size: 0.68rem;
  font-weight: bold;
  padding: 0.12rem 0.4rem;
  border-radius: 3px;
  border: 1px solid #ddd;
  background: #fff;
  color: #888;
  cursor: pointer;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  padding-right: 1.1rem;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><polygon points='0,3 10,3 5,8' fill='%23999'/></svg>");
  background-repeat: no-repeat;
  background-position: right 0.25rem center;
}
.verdict-select:hover { border-color: #999; }
.verdict-select:focus { outline: 2px solid #5a8ec9; outline-offset: 1px; }
.verdict-select.v-clear     { background-color: #e3fafc; color: #0c8599; border-color: #99e9f2; }
.verdict-select.v-burnout   { background-color: #fff4e6; color: #d9480f; border-color: #ffd8a8; }
.verdict-select.v-crisis    { background-color: #ffe3e3; color: #a61e1e; border-color: #ffa8a8; }
.verdict-select.v-edge      { background-color: #fff9db; color: #9c5d00; border-color: #ffec99; }

/* Edge case → see notes hint */
.edge-hint {
  font-family: 'Courier New', monospace;
  font-size: 0.62rem;
  color: #9c5d00;
  background: #fff9db;
  border: 1px solid #ffec99;
  padding: 0.08rem 0.32rem;
  border-radius: 3px;
  flex-shrink: 0;
  font-style: italic;
}
.toggle-icon {
  font-size: 0.7rem;
  color: #aaa;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.card.expanded .toggle-icon { transform: rotate(90deg); }

/* ── Card body (expanded view) ── */
.card-body {
  display: none;
  padding: 0 1.5rem 1.25rem 1.5rem;
  border-top: 1px solid #f0ede4;
}
.card.expanded .card-body { display: block; }

.section-label {
  font-family: 'Courier New', monospace;
  font-size: 0.68rem;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 1rem 0 0.3rem 0;
}

/* Pattern desc textarea */
.pattern-textarea {
  width: 100%;
  font-family: Georgia, serif;
  font-size: 0.85rem;
  color: #333;
  background: #f7f4ee;
  border: 1px solid #ddd;
  border-radius: 3px;
  padding: 0.5rem 0.65rem;
  resize: vertical;
  min-height: 3.5rem;
  line-height: 1.5;
}
.pattern-textarea:focus { outline: 2px solid #5a8ec9; border-color: #5a8ec9; background: #fff; }

/* Excerpt blockquote (click to copy) */
.excerpt-block {
  background: #fffbe6;
  border-left: 4px solid #f0c040;
  padding: 0.6rem 1rem;
  margin: 0;
  font-size: 0.88rem;
  font-style: italic;
  color: #333;
  border-radius: 0 4px 4px 0;
  cursor: copy;
  position: relative;
  transition: background 0.15s;
}
.excerpt-block:hover { background: #fff5cc; }
.excerpt-block::after {
  content: 'click to copy';
  position: absolute;
  top: 0.3rem;
  right: 0.5rem;
  font-family: 'Courier New', monospace;
  font-size: 0.6rem;
  font-style: normal;
  color: #b08020;
  opacity: 0;
  transition: opacity 0.15s;
}
.excerpt-block:hover::after { opacity: 0.7; }
.excerpt-block.copied { background: #d3f9d8; border-left-color: #2f9e44; }
.excerpt-block.copied::after { content: 'copied ✓'; opacity: 1; color: #2f9e44; }

/* Essay text */
.essay-text {
  font-size: 0.88rem;
  color: #333;
  line-height: 1.65;
  white-space: pre-wrap;
  background: #fdfcf8;
  border: 1px solid #e8e4da;
  border-radius: 3px;
  padding: 0.75rem 1rem;
  max-height: 420px;
  overflow-y: auto;
}
.essay-text mark {
  background: #ffe066;
  color: #333;
  border-radius: 2px;
  padding: 0 1px;
}

/* Notes textarea */
.notes-textarea {
  width: 100%;
  font-family: Georgia, serif;
  font-size: 0.85rem;
  color: #333;
  background: #f0f7ff;
  border: 1px solid #c5d8ef;
  border-radius: 3px;
  padding: 0.5rem 0.65rem;
  resize: vertical;
  min-height: 4rem;
  line-height: 1.5;
}
.notes-textarea:focus { outline: 2px solid #5a8ec9; border-color: #5a8ec9; background: #fff; }
.notes-autosave-msg {
  font-family: 'Courier New', monospace;
  font-size: 0.65rem;
  color: #aaa;
  margin-top: 0.2rem;
}

/* ── State export/import ── */
#import-textarea {
  width: 100%;
  font-family: 'Courier New', monospace;
  font-size: 0.75rem;
  height: 120px;
  padding: 0.5rem;
  border: 1px solid #ccc;
  border-radius: 3px;
  resize: vertical;
}

  </style>

<script>
const CORPUS = [
  {"id": "S001", "name": "Maria Ndiaye", "category": "protected", "pattern_key": "esl", "pattern_desc": "ESL/multilingual student — grounds theory in grandmother's experience in Senegal and immigrant family in US; L2 English syntax throughout; argues the framework should include non-American voices", "excerpt": "when my mother go to the school meeting and people treat her different because she have accent and she wear hijab", "text": "When I first read about intersectionality I was thinking on my grandmother in Dakar. She is a woman, she is Wolof, she is old now and she don't have much money. In Senegal people don't use this word intersectionality but everybody know that life is harder when you are many things at once that society don't value. My grandmother she always say that being woman in Senegal is one thing but being poor woman who is also from village that is another thing completely.\n\nWhen my family come to America I see same thing but different. My mother she is Black woman here but also immigrant and also Muslim and each of these things it add up. The reading talk about how categories overlap and I think this is true but it is not just categories on paper. It is real life every day, like when my mother go to the school meeting and people treat her different because she have accent and she wear hijab. Intersectionality for me it is not theory it is just what my family live through and I think the reading could be stronger if it include voices from outside America because this experience it is everywhere not just here.", "word_count": 205, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S002", "name": "Jordan Kim", "category": "burnout", "pattern_key": "burnout", "pattern_desc": "Burnout signal — submission cuts off mid-sentence ('its late and'); the truncation IS the pattern; student had more to say but didn't finish", "excerpt": "Idk I had more to say but its late and", "text": "The reading about intersectionality made me think about how Crenshaw talks about the ways that race and gender overlap to create unique experiences that you cant really understand by just looking at one thing at a time. Like my mom is Korean and a woman and her experience is different from my dads even though theyre in the same family. I think this connects to what we talked about last week about how identity is not just one thing. Idk I had more to say but its late and", "word_count": 89, "corpus": "ES", "expected": "FLAG"},
  {"id": "S003", "name": "Alex Hernandez", "category": "concern", "pattern_key": "smoking_gun", "pattern_desc": "Academic integrity concern — submission contains raw HTML formatting tags (<h2>, <p>, <strong>); structured headers with no personal voice; consistent with AI-generated output pasted directly into the submission box", "excerpt": "<h2>Understanding Intersectionality</h2>", "text": "<h2>Understanding Intersectionality</h2>\n\n<p>Intersectionality is a theoretical framework that examines how various social categorizations such as race, class, and gender interact on multiple levels to create overlapping systems of discrimination or disadvantage.</p>\n\n<h3>Key Aspects</h3>\n\n<p>The concept was first coined by **Kimberlé Crenshaw** in 1989 to address the marginalization of Black women within both feminist and anti-racist discourse. It recognizes that individuals possess multiple, layered identities that shape their lived experiences in profound ways.</p>\n\n<h3>Why It Matters</h3>\n\n<p>Furthermore, intersectionality provides a **critical lens** through which we can analyze **systemic inequality**. It demonstrates that social categories are not independent but rather interconnected, creating **complex systems** of privilege and oppression that affect individuals differently based on their unique combination of identities.</p>", "word_count": 117, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S004", "name": "Priya Venkataraman", "category": "strong", "pattern_key": "strong", "pattern_desc": "Strong analytical engagement — applies framework to mother's Tamil Nadu / immigrant experience at parent-teacher conferences; names 'all three working together in that one moment'; raises genuine boundary question: does the framework travel to South Asian immigrant women?", "excerpt": "That's not just racism and it's not just sexism and it's not just some bias against her accent marking her as less educated — it's all three working together in that one moment where a teacher decides she doesn't need to be taken seriously.", "text": "Reading Crenshaw changed how I think about something that's been bothering me for years. My mom is from Tamil Nadu and she's also a woman and she's also an immigrant who didn't go to college here. I used to think about those things as separate facts about her. But the reading made me see they're not separate at all — they compound each other in a specific way.\n\nLike when she goes to parent-teacher conferences, teachers talk slower to her even though she has a master's degree from Chennai. That's not just racism and it's not just sexism and it's not just some bias against her accent marking her as less educated — it's all three working together in that one moment where a teacher decides she doesn't need to be taken seriously. Intersectionality names that thing I knew was happening but didn't have language for.\n\nWhat the framework gets right is that you can't fix one piece and call it done. Even if you fix the sexism you still have the accent bias. You need to look at the whole picture of how someone is being read in a room. That's what I took from this reading.\n\nI also think the Crenshaw piece was written primarily about Black women in America and I wonder whether the framework travels to my mom's situation exactly the same way or if there's something slightly different about South Asian immigrant women. I don't have an answer but it's a question I keep coming back to.", "word_count": 230, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S005", "name": "Amara Diallo", "category": "strong", "pattern_key": "strong", "pattern_desc": "Strong analytical engagement — uses grandmother's Guinea→France trajectory to show intersectionality exists globally; critiques the framework's American-only construction; quotes family saying ('a woman's burdens have many handles')", "excerpt": "my grandmother's experience doesn't map cleanly onto American racial hierarchies. There's a whole layer about colonialism and francophone identity that intersectionality doesn't fully account for.", "text": "In my family we have a saying my mother taught me that translates roughly to 'a woman's burdens have many handles' — meaning the things that can grab you and pull you down come in many forms. I didn't know this had an academic name until this class.\n\nMy grandmother came from Guinea to France in the 1970s. She was Black, she was Muslim, she was poor, she was a woman, she was an immigrant, and her French was accented. In France she was too African. When she visited Guinea she was too French. She fit nowhere cleanly and was penalized for that in every space she entered. Crenshaw's framework gives me language for what my grandmother lived — not one discrimination piled on another like separate weights, but a kind of specific visibility that means you are always readable as 'not quite right' no matter where you stand.\n\nI do think the framework is incomplete in one way. It was built on American categories and my grandmother's experience doesn't map cleanly onto American racial hierarchies. There's a whole layer about colonialism and francophone identity that intersectionality doesn't fully account for. But it's a better starting point than pretending identity is simple, and at least it gives you a way to talk about why the simple picture keeps failing people.", "word_count": 217, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S006", "name": "Sofia Esparza", "category": "strong", "pattern_key": "strong", "pattern_desc": "Strong analytical engagement — applies framework to cousin Valentina's experience as a Latina CNA; argues intersectional discrimination has downstream clinical consequences on patients; 'the hospital wasn't designed with Valentina in mind'", "excerpt": "Intersectionality isn't just a framework for understanding oppression, it's a framework for understanding how things go wrong in systems that were built with a specific kind of person in mind as the default.", "text": "I've been thinking about how intersectionality shows up in who gets believed.\n\nMy cousin Valentina works in a hospital as a CNA. She's Mexican American, she's 22, she didn't finish college, and she's on the heavier side. When she tells a doctor that a patient is in pain or that something looks wrong, she gets ignored more than the older white nurses. She can't point to just one reason. Is it because she's Latina? Because she doesn't have a degree? Because of her age? Because of her size? It's all of it arriving at once and someone decides in a few seconds whether to take her seriously.\n\nWhat the reading helped me see is that those seconds matter clinically. A patient doesn't get pain medication. A condition gets missed. The discrimination against Valentina isn't just unfair to her — it has actual downstream consequences on the people she's trying to help.\n\nIntersectionality isn't just a framework for understanding oppression, it's a framework for understanding how things go wrong in systems that were built with a specific kind of person in mind as the default. The hospital wasn't designed with Valentina in mind and the reading gives me a way to say why that matters.", "word_count": 205, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S007", "name": "Rashida Thompson", "category": "strong", "pattern_key": "strong", "pattern_desc": "Strong analytical engagement — DeGraffenreid case lands hard; connects to Black girls coded as 'aggressive' at school; argues 'The system literally could not see them' — names seeing as a structural skill to learn", "excerpt": "Those women lost. Not because the discrimination didn't happen. Because the legal system was built to see race or gender, not both at once. The system literally could not see them.", "text": "I wasn't expecting to care about this reading as much as I did. I've seen the word 'intersectionality' used online a lot, sometimes without much behind it. But reading Crenshaw's actual argument — the DeGraffenreid case, where Black women couldn't sue for race discrimination because Black men weren't affected, and couldn't sue for sex discrimination because white women weren't affected — stopped me cold.\n\nThose women lost. Not because the discrimination didn't happen. Because the legal system was built to see race or gender, not both at once. The system literally could not see them. That's not an accident or an oversight, that's a structural choice about who counts.\n\nI kept connecting it to things I see in my own school. The students who get suspended most aren't just Black students — it's specifically Black girls who get coded as 'aggressive' or 'threatening' in ways that white girls doing the same behavior never are. That's not just racism and not just sexism. It's something that only happens at that specific intersection and you can't fix it without naming it as such.\n\nThe framework is empowering in that way. Naming what's actually happening is the first step to changing it. The law couldn't see those women. I want to learn how to see people more completely than the systems that were built to process them.", "word_count": 221, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S008", "name": "Jasmine Holloway", "category": "moderate", "pattern_key": "moderate", "pattern_desc": "Moderate engagement — understands legal example clearly; makes tentative personal connection she's still working out; raises a genuine unanswered question (analysis vs. prescription)", "excerpt": "I do wonder whether intersectionality is mostly useful for analysis or whether it also tells you what to do.", "text": "The reading about intersectionality was something my older sister mentioned when she took this class last year. She told me it was basically about how different parts of your identity combine and affect your life together, not just individually.\n\nI think the example from the reading about Black women in workplace discrimination cases was really clear. Like, you can't sue for race discrimination because there are Black men who weren't discriminated against, and you can't sue for sex discrimination because there are white women who weren't discriminated against. So the law can't see what actually happened to you. That's a really concrete problem and I appreciated that Crenshaw used legal cases because it shows this isn't just a philosophical argument.\n\nPersonally I connect to this with my own family but I'm still figuring out how exactly. I might write more about that once I've thought it through. For now I just wanted to show that I understood the main argument and I think it's right.\n\nI do wonder whether intersectionality is mostly useful for analysis or whether it also tells you what to do. Like once you understand that someone is at a multiple-disadvantage intersection, what's the next step? I think the reading was clearer on the diagnosis than on the treatment.", "word_count": 200, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S009", "name": "Kevin Osei", "category": "moderate", "pattern_key": "moderate", "pattern_desc": "Moderate engagement — accurate summary with applications to other groups (disabled LGBTQ, Indigenous women); acknowledges he doesn't have much to add; honest about the limits of his contribution", "excerpt": "I can see how this applies to other groups — disabled LGBTQ people, Indigenous women, low-income immigrants.", "text": "Intersectionality is the idea that different parts of your identity don't work separately, they combine. Being Black and a man and working class aren't three different things you experience one at a time — they interact and create a specific experience that's different from someone who shares only one of those traits.\n\nThe reading made a good point about how a lot of civil rights frameworks focus on one axis at a time and that leaves people out. The example with Black women not being able to use existing legal protections because the protections were designed for either Black people or women was useful for understanding why a more complex analysis is necessary.\n\nI can see how this applies to other groups — disabled LGBTQ people, Indigenous women, low-income immigrants. Each of those is a combination that creates something specific that a single-issue framework misses.\n\nI think the reading was useful and the concept makes sense. I'm not sure I have much to add to it beyond agreeing with the argument and thinking it should be applied more widely in how we design laws and institutions.", "word_count": 170, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S010", "name": "Tyler Nguyen", "category": "concern", "pattern_key": "sustained_cheat", "pattern_desc": "Academic integrity concern (sustained) — well-formed analytical paragraphs with no personal voice; generic academic register; 'triple jeopardy' framing; reads as AI-generated throughout", "excerpt": "The author argues that simply being a woman of color, for example, does not automatically mean that one experiences oppression. Rather, it is the intersection of factors such as race, class, and sexuality that determines one's positionality.", "text": "The reading on intersectionality highlights the complexities of identity and how different aspects of it interact to create unique experiences of privilege and oppression. The author argues that simply being a woman of color, for example, does not automatically mean that one experiences oppression. Rather, it is the intersection of factors such as race, class, and sexuality that determines one's positionality. This idea is particularly relevant in understanding the experiences of marginalized communities, as it emphasizes the need to consider multiple axes of identity.\n\nI found it striking that the author uses the example of the \"triple jeopardy\" faced by black women in the Civil Rights Movement. Despite being a key figure in the movement, black women like Sojourner Truth and Ida B. Wells faced both racism and sexism. This intersection of oppressions highlights the ways in which different forms of oppression can intersect and exacerbate one another.\n\nWhat struck me most about this reading was the emphasis on the need for a more nuanced understanding of identity and power dynamics. Simply being a member of a marginalized group is not enough to guarantee solidarity or shared experiences. Rather, we need to consider the specific ways in which different individuals intersect with multiple forms of oppression.", "word_count": 206, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S011", "name": "Jaylen Carter", "category": "concern", "pattern_key": "sustained_cheat", "pattern_desc": "Academic integrity concern (sustained) — polished academic prose with no personal connection; generic examples ('woman of color may face both sexism and racism'); reads as AI-generated", "excerpt": "By considering multiple identities and experiences, intersectionality sheds light on the ways in which dominant groups maintain power and privilege.", "text": "Intersectionality is a crucial concept in ethnic studies that helps us comprehend the complexities of discrimination. Developed by Kimberlé Crenshaw, intersectionality acknowledges that individuals have multiple identities that intersect and overlap, creating unique experiences of marginalization. For example, a woman of color may face both sexism and racism, which cannot be addressed separately. Intersectionality recognizes that these forms of oppression are not mutually exclusive, but rather interconnected, leading to a more nuanced understanding of the ways in which social inequalities intersect.\n\nBy considering multiple identities and experiences, intersectionality sheds light on the ways in which dominant groups maintain power and privilege. It highlights the need to address the systemic inequalities that result from the intersections of racism, sexism, homophobia, and other forms of oppression. Intersectionality encourages us to move beyond a simplistic, additive approach to understanding identity and instead, to consider the complex ways in which multiple forms of oppression are experienced simultaneously. By doing so, we can develop more effective strategies for promoting social justice and challenging the status quo. Ultimately, intersectionality offers a powerful framework for analyzing and addressing the complexities of oppression in our society.", "word_count": 188, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S012", "name": "Talia Reyes", "category": "moderate", "pattern_key": "moderate", "pattern_desc": "Moderate engagement — grasps 'not additive, 1+1≠2 but interactive'; tentative personal connection (Latina in honors classes, feeling like she doesn't fully belong)", "excerpt": "I'm Latina and I'm in honors classes and sometimes I get treated like I don't fully belong or like I got in through some program, even by other students.", "text": "I found this reading pretty interesting because I had heard about intersectionality before but never had it explained this carefully. I knew that people have multiple identities and can face different kinds of discrimination, but I hadn't thought about how those forms of discrimination can actually interact to create something new instead of just stacking up.\n\nThe reading says it's not just 1+1=2. It's more like they create a specific intersection point that has its own character. I think that's actually a more accurate way to describe how people experience their lives.\n\nI tried to think about this in my own life. I'm Latina and I'm in honors classes and sometimes I get treated like I don't fully belong or like I got in through some program, even by other students. I'm not totally sure if that's what the reading is describing or whether I'm reaching. But it felt connected.\n\nOverall it was a good reading for this class and I feel like I understood it. I think I want to think about it more before I have a strong opinion.", "word_count": 175, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S013", "name": "Elijah Summers", "category": "moderate", "pattern_key": "moderate", "pattern_desc": "Moderate engagement — applies framework to neighborhood policing (distinct treatment of Black men / women / trans women); argues the framework should be taught earlier", "excerpt": "Black men get policed one way, Black women get policed another way, and Black trans women get policed in a way that's completely different and far more dangerous.", "text": "Intersectionality is the framework that Kimberlé Crenshaw developed to describe how different aspects of identity — race, gender, class, sexuality, disability — overlap and create compounded experiences instead of separate ones.\n\nI think this reading was relevant to what we've been studying about how systems get built. Systems get built with a certain kind of person in mind and everyone else has to navigate around that. Intersectionality explains why navigating is harder for some people than others — because they're dealing with multiple ways the system wasn't designed for them.\n\nIn my neighborhood I see this with how policing works. Black men get policed one way, Black women get policed another way, and Black trans women get policed in a way that's completely different and far more dangerous. That's intersectionality showing up in something concrete and current.\n\nI think this framework should be taught earlier. The sooner you have language for these patterns, the sooner you can name them when you see them.", "word_count": 157, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S014", "name": "Sierra Nakamura", "category": "moderate", "pattern_key": "moderate", "pattern_desc": "Moderate engagement — applies framework to friend Deja (Black + deaf, partial belonging in both spaces); raises analysis-vs-action question", "excerpt": "there are spaces that are welcoming to deaf people that are mostly white, and spaces that are welcoming to Black people where her disability is invisible or treated as secondary.", "text": "I kept thinking about my friend Deja while reading this. She's Black and also deaf and navigating high school in ways none of the rest of us really understand. The deaf community has its own culture and its own discrimination issues, and then racial stuff layers on top of that, and sometimes they conflict. Like there are spaces that are welcoming to deaf people that are mostly white, and spaces that are welcoming to Black people where her disability is invisible or treated as secondary.\n\nIntersectionality helps me understand why it can be so exhausting to try to fit into any single community when you belong to multiple groups that don't always talk to each other. You keep getting offered partial belonging.\n\nThe Crenshaw reading was kind of dense in places but I followed it. I'm still thinking about one question it raised for me: is intersectionality a framework for analysis or also for action? Can you use it to decide what to do, or mostly just to describe what's happening? I don't have an answer but I think it's a real question and I didn't see the reading answer it fully.", "word_count": 185, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S015", "name": "Brittany Okafor", "category": "concern", "pattern_key": "essentializer", "pattern_desc": "Pattern concern — essentializing: applies framework to affirm positive cultural stereotypes ('Mexican families are always so close,' 'Black families have this amazing resilience') — celebratory essentialism that flattens individuals into group traits", "excerpt": "the Black families on my street they have this amazing resilience and they always look out for each other too.", "text": "I really liked the reading about intersectionality because it made me think about the different cultures in my neighborhood. Like in my neighborhood the Mexican families are always so close and they really support each other and I think thats what intersectionality is about, like how different backgrounds come together and make communities stronger. And the Black families on my street they have this amazing resilience and they always look out for each other too. I think all cultures have something beautiful about them and if we could just appreciate what makes each group special instead of discriminating then we would be so much better off.\n\nThe reading talked about how identity is layered and I see that with my friend Rosa who is Latina and also queer and shes like the strongest person I know because of all she has been through. I think intersectionality shows us that diversity is our greatest strength and we should celebrate all the things that make each culture unique.", "word_count": 166, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S016", "name": "Brianna Foster", "category": "moderate", "pattern_key": "moderate", "pattern_desc": "Moderate engagement — personal as Black girl ('too much of one thing or not enough of another'); can't always tell which axis is doing more work; wishes for more class discussion", "excerpt": "I'm a Black girl and I've definitely felt like sometimes I'm too much of one thing or not enough of another.", "text": "I understood the main idea of the reading — identity categories overlap and create unique experiences — and I think it makes sense. The legal cases Crenshaw uses are really clear illustrations of why the concept matters practically.\n\nI personally connected to it because I'm a Black girl and I've definitely felt like sometimes I'm too much of one thing or not enough of another. Like there are moments where I think the way people see me is about my race and moments where it seems more like it's about being a girl and moments where I genuinely can't tell which one is doing more work. Reading this helped me see that maybe I don't have to tell which one — they're working together and that's exactly the point.\n\nI wish we had more time to talk about this in class instead of just reading about it. I feel like hearing everyone else's experiences would have made it more real. I'm probably more of a talker than a writer.", "word_count": 160, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S017", "name": "Tyler Huang", "category": "surface", "pattern_key": "surface", "pattern_desc": "Surface engagement — accurate bare-minimum summary; 'I don't have a lot to add beyond that'; no personal connection or extension", "excerpt": "I don't have a lot to add beyond that. I understood the reading and I think the concept is important for thinking about equity.", "text": "Intersectionality is when different parts of your identity overlap and affect each other. A Black woman experiences discrimination differently from what Black men experience and also differently from what white women experience, because she has both of those identities at once.\n\nThe reading by Crenshaw explained this with some legal examples that showed how existing laws couldn't protect people who faced discrimination on multiple fronts at once. I thought that was a clear way to explain why the concept matters.\n\nI don't have a lot to add beyond that. I understood the reading and I think the concept is important for thinking about equity.", "word_count": 103, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S018", "name": "Connor Walsh", "category": "concern", "pattern_key": "colorblind", "pattern_desc": "Pattern concern — colorblind ideology: acknowledges framework, then argues for individual-level colorblindness ('I just try to treat everyone the same'); frames categories and labels as divisive; undercuts the framework's premise", "excerpt": "I just try to treat everyone the same regardless of what they look like or where they come from. I dont really see the point of focusing so much on categories and labels because I feel like that just divides people more.", "text": "I thought the reading on intersectionality was interesting and I can see why people study it. The idea that different parts of your identity affect how you experience the world makes sense to me. Like I understand that someone who is a woman and also Black might face challenges that are different from someone who is just one of those things.\n\nBut honestly at the end of the day I just try to treat everyone the same regardless of what they look like or where they come from. I dont really see the point of focusing so much on categories and labels because I feel like that just divides people more. When I meet someone I dont think about their race or gender I just see a person. I think if more people had that attitude we wouldnt need frameworks like intersectionality because we would just respect each other as individuals.\n\nI know some people might disagree with me on this but I think focusing too much on differences can actually make things worse sometimes.", "word_count": 175, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S019", "name": "Paige Kowalczyk", "category": "surface", "pattern_key": "surface", "pattern_desc": "Surface engagement — one-paragraph correct summary with no development; 'I plan to use this concept as we continue through the unit'", "excerpt": "I plan to use this concept as we continue through the unit.", "text": "Intersectionality means that different aspects of identity like race, gender, class, and sexuality overlap and can lead to worse outcomes for people who have multiple marginalized identities. It was developed by Kimberlé Crenshaw.\n\nI think the reading was informative. The examples it used to show how Black women fell through the gaps of both anti-discrimination frameworks were useful for understanding why a more complex analysis is necessary.\n\nIdentity is complicated and intersectionality is a good framework for thinking about it. I plan to use this concept as we continue through the unit.", "word_count": 93, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S020", "name": "Jake Novak", "category": "challenger", "pattern_key": "premise_challenger", "pattern_desc": "Premise challenger — raises class/economic blind spot: white working-class family, dad works two jobs, mom disabled, can't pay electric bill; frames this as 'its own kind of erasure'; intellectually serious dissent that doesn't dismiss racism but argues the framework has a class blind spot", "excerpt": "My family is white and poor. Like actually poor, not just middle class complaining about money. My dad works two jobs and my mom is disabled and nobody in this framework really talks about us. When the reading says that privilege operates along axes of race and gender I want to ask where does my dad's privilege come in? He cant pay the electric bill half the time. Thats its own kind of erasure.", "text": "Ok so I read the piece on intersectionality and I have some real questions about it. The framework talks about how race gender class all these categories overlap to create different experiences of oppression and I get that. But the reading acts like intersectionality covers everything and it doesnt.\n\nMy family is white and poor. Like actually poor, not just middle class complaining about money. My dad works two jobs and my mom is disabled and nobody in this framework really talks about us. When the reading says that privilege operates along axes of race and gender I want to ask where does my dad's privilege come in? He cant pay the electric bill half the time. Thats its own kind of erasure.\n\nIm not saying racism isnt real because obviously it is. Im saying that this framework has a blind spot for class when its separated from race and I think thats worth talking about instead of just accepting the reading as gospel.", "word_count": 164, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S021", "name": "Cameron Schultz", "category": "surface", "pattern_key": "surface", "pattern_desc": "Surface engagement — reports comprehension without development; 'I found the reading kind of dense but I got the main point'", "excerpt": "I found the reading kind of dense but I got the main point. Identity is layered and you can't understand someone's experience by looking at just one layer.", "text": "This reading was about intersectionality, which is the concept that people have multiple identities and those identities interact with each other in ways that affect their experiences. Kimberlé Crenshaw developed the theory to explain why Black women were being left out of both civil rights and feminist legal protections.\n\nI found the reading kind of dense but I got the main point. Identity is layered and you can't understand someone's experience by looking at just one layer.\n\nI think this will be a useful concept for the rest of the course.", "word_count": 91, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S022", "name": "Destiny Williams", "category": "protected", "pattern_key": "righteous_anger", "pattern_desc": "Protected pattern — righteous anger: expresses legitimate fury about redlining's ongoing material consequences in her neighborhood; anger is substantively engaged (specific, accurate, historically grounded); must NOT be flagged as a concern", "excerpt": "Im tired of pretending we can discuss it calmly like it doesnt affect real people right now.", "text": "This reading made me furious and I mean that in a good way. How can we sit here and read about redlining and act like its ancient history when my neighborhood still looks exactly like the map from 1940?? The same blocks that were red-lined are the same blocks with no grocery stores no good schools no investment. That is intersectionality in PRACTICE not just theory.\n\nAnd it makes me angry when people act like talking about race is divisive. You know whats divisive? Literal lines drawn on a map that decided which neighborhoods got resources and which ones didnt and then telling the people who got nothing that they should just work harder. The reading talks about overlapping systems and YES thats exactly it — my grandmother was Black AND poor AND a woman AND living in a neighborhood the government decided wasnt worth investing in.\n\nIntersectionality isnt just an academic concept. Its the story of my family and millions of families like mine and Im tired of pretending we can discuss it calmly like it doesnt affect real people right now.", "word_count": 183, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S023", "name": "Yolanda Fuentes", "category": "protected", "pattern_key": "lived_experience_no_vocab", "pattern_desc": "Protected pattern — lived experience without academic vocabulary: grandmother Esperanza's story precisely describes intersectionality without using the term; 'I don't know the academic word for this' — knows the phenomenon, lacks the framework's language", "excerpt": "I don't know the academic word for this. But watching her my whole life I know what it feels like when someone gets seen as a whole person and when they get reduced to just one thing about them.", "text": "My abuela's name is Esperanza and she came to this country when she was nineteen. She's seventy-two now and she still cleans houses. Not because she didn't try to do something else — she tried. But when you don't speak English and you're a woman and you came here without papers and you're sending money home to Oaxaca every month, your choices get narrow fast.\n\nShe became invisible in a specific way. The doctors talk to my mom instead of her even now, like she's not in the room. At the market people act like she doesn't understand what they're saying even when she does. But at church she's respected because she's been there longer than almost anyone, and she knows things about people's families going back thirty years.\n\nI've thought a lot about why some places see her one way and other places see her another way. It's not just that she's old, or just that she speaks Spanish first, or just that she cleaned houses her whole life. It's all of those things at the same time, and they all weigh different depending on where she's standing.\n\nI don't know the academic word for this. But watching her my whole life I know what it feels like when someone gets seen as a whole person and when they get reduced to just one thing about them.", "word_count": 218, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S024", "name": "Ingrid Vasquez", "category": "protected", "pattern_key": "lived_experience_no_vocab", "pattern_desc": "Protected pattern — lived experience without academic vocabulary: mother's undocumented Honduran factory worker story; 'Any one of those things she might have found a way around. All of them together meant there was no way out.' — textbook intersectionality, no jargon", "excerpt": "Any one of those things she might have found a way around. All of them together meant there was no way out.", "text": "My mom always tells this story about when she first came here from Honduras. She was 22, she spoke no English, she was pregnant with my sister. She got a job at a textile factory and her boss knew she was undocumented and used that to keep her from saying anything when the conditions were bad. She worked around chemicals that weren't supposed to be used without ventilation. She got headaches every day. She didn't complain because she couldn't afford to lose the job and she couldn't afford anyone asking too many questions.\n\nWhen she tells the story now she says she felt like she didn't exist. Not invisible exactly — people could see her. But they could act like her wellbeing didn't count. She was there to produce and if she got sick that was her problem.\n\nWhat made her situation so hard wasn't any one thing. It was that she was a woman and pregnant and an immigrant and undocumented and didn't speak the language — and each of those things meant the people who could have helped her felt like they didn't have to. Any one of those things she might have found a way around. All of them together meant there was no way out.\n\nI think that's what the reading is trying to describe. My mom lived it before I had words for it.", "word_count": 220, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S025", "name": "Aiden Brooks", "category": "concern", "pattern_key": "tone_policer", "pattern_desc": "Pattern concern — tone policing: deflects from content by calling for less emotional engagement ('when people start getting angry or raising their voices it actually makes it harder'); frames anger as an obstacle; silences righteous anger without engaging substance", "excerpt": "I feel like when people start getting angry or raising their voices it actually makes it harder to have a productive conversation and some people just shut down.", "text": "I read the piece on intersectionality and I think it raises some good points about how identity is complex. The idea that peoples experiences are shaped by multiple factors at once is something I can agree with.\n\nI do want to say though that I feel like in class discussions about this stuff people get really heated and I think we should be able to have these conversations without getting so emotional about it. Like were all here to learn right? I get that this is important to people but I feel like when people start getting angry or raising their voices it actually makes it harder to have a productive conversation and some people just shut down.\n\nI think we can talk about intersectionality and systemic issues in a way thats respectful to everyone in the room. We should focus on understanding each others perspectives instead of trying to win arguments. Just my two cents.", "word_count": 156, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S026", "name": "DeShawn Mercer", "category": "protected", "pattern_key": "lived_experience_no_vocab", "pattern_desc": "Protected pattern — lived experience without academic vocabulary: brother Malik's school discipline story (Black + ADHD + single working mom); explicitly notes 'I didn't learn any of this from a reading. I learned it from watching my family.'", "excerpt": "I didn't learn any of this from a reading. I learned it from watching my family. But I recognize it in the reading now that I've done it.", "text": "My little brother Malik has ADHD and he's also Black and he's nine. I've been watching what's happening to him at his school and I have a lot of feelings about it.\n\nWhen Malik can't sit still or blurts something out, he gets sent to the office. When I've been there and seen white kids in his class do the same thing, they get redirected or given a warning. Malik gets a discipline referral. My mom has been fighting this for two years. She pulls his records, she goes to meetings, she asks questions. But she works overnight shifts at the hospital and she's doing this alone and she is exhausted.\n\nSo what's happening to Malik is about his ADHD, because schools don't always know how to teach kids whose brains work like his. And it's about being Black, because Black boys get read as a threat before anyone else. And it's about not having money for a private therapist or an advocate. And it's about my mom being a single woman without a partner to split this work with.\n\nI didn't learn any of this from a reading. I learned it from watching my family. But I recognize it in the reading now that I've done it.", "word_count": 209, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S027", "name": "Camille Osei", "category": "outside_source", "pattern_key": "outside_source", "pattern_desc": "Outside source integration — brings in Maintenance Phase podcast on BMI history to operationalize intersectionality: white European male body as default, tool extended to everyone; explicitly connects to Crenshaw's critique of frameworks built for one person", "excerpt": "The BMI was developed in the 1800s using only white European men as the data set. That's it. And now it's the primary tool doctors use to evaluate health for everybody.", "text": "For this reflection I want to bring in something we didn't read in class. There's a podcast called Maintenance Phase — it's about wellness culture and health misinformation — and they did an episode about the history of the BMI. The BMI was developed in the 1800s using only white European men as the data set. That's it. And now it's the primary tool doctors use to evaluate health for everybody.\n\nWhat that episode made clear is that the tool itself encodes the assumption that the white European male body is the standard, and everyone else is a deviation from it. So when a fat Black woman goes to the doctor and gets told her BMI is too high, she's being evaluated by a tool that was never designed with her in mind — and may be actively misleading about her actual health — but the doctor treats it as neutral science.\n\nThat's intersectionality in action. Her experience at the doctor is not just about being fat, or just about being Black, or just about being a woman. The belief that the tool is neutral makes it harder to question any single piece of it.\n\nI know this wasn't assigned reading but I think it connects directly to what Crenshaw is arguing. The BMI is a framework built for one person and extended to everyone. So was the law Crenshaw was critiquing.", "word_count": 219, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S028", "name": "Imani Drayton", "category": "protected", "pattern_key": "nonstandard_english", "pattern_desc": "Protected pattern — AAVE/nonstandard English register: writes in vernacular ('a whole different channel that comes with its own static'); highly substantive; ends with 'This framework finally gave me academic language for lived reality'", "excerpt": "It's not Black plus girl. It's like a whole different channel that comes with its own static.", "text": "Ok so I'm just gonna be real with this one because I feel like that's what this assignment is asking for.\n\nThe reading is talking about something I already knew but didn't have a name for. Like I been knowing that being Black and being a girl is its own specific thing. It's not Black plus girl. It's like a whole different channel that comes with its own static.\n\nThe way teachers talk to me versus how they talk to my Black guy friends versus how they talk to white girls — it's different. Not always in a way you can point to and say that's the thing. It's more like a texture. The expectations are different. The patience is different. The benefit of the doubt is different.\n\nCrenshaw is talking about Black women in 1989 courts but honestly it hits the same in 2026 high school hallways. The frame is the same. Who gets seen, who gets believed, who has to work twice as hard to get half the credit.\n\nI learned this from watching my mama navigate the world, not from a textbook. She never said the word intersectionality but she showed me what it meant every time she had to code switch in a meeting or smile through something she should've been able to push back on.\n\nThis framework finally gave me academic language for lived reality. That's actually kind of powerful.", "word_count": 220, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S029", "name": "Jordan Espinoza", "category": "protected", "pattern_key": "neurodivergent_writing", "pattern_desc": "Protected pattern — neurodivergent writing style: fragmented structure, self-aware about form ('I'm better at talking than writing'); explicitly asks to be assessed on comprehension not structure; 'the intersections are real even when the essay isn't perfect'", "excerpt": "I have a lot more to say but my thoughts aren't organized in the way an essay is supposed to be organized. I know. I'm better at talking than writing. but I think I showed I understood it even if the structure isn't right.", "text": "intersectionality\n\nok so I'm going to try to write this and hopefully it makes sense. the reading is about how people have multiple identities and they don't just add together, they interact. Crenshaw was saying Black women in the lawsuits couldn't use race discrimination because Black men weren't affected and couldn't use sex discrimination because white women weren't affected so they fell through this gap in between.\n\nthat gap is the intersection I think\n\nwhat I want to say for my own life: I have dyslexia and ADHD and I'm also Latino and I'm the first in my family to take honors classes. the way all of that interacts is exhausting to explain. people see the dyslexia and think I need simpler stuff. people see I'm Latino and sometimes seem surprised I'm in honors. people see ADHD and think I'm not serious. but I'm all of it at once and the combination is its own specific thing.\n\nI have a lot more to say but my thoughts aren't organized in the way an essay is supposed to be organized. I know. I'm better at talking than writing. but I think I showed I understood it even if the structure isn't right.\n\nthe intersections are real even when the essay isn't perfect.", "word_count": 200, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S030", "name": "Aaliyah Robinson", "category": "protected", "pattern_key": "oral_tradition", "pattern_desc": "Protected pattern — oral/storytelling tradition: structures entire reflection as family narrative (great-aunt Lorraine, Mississippi 1950s, sorting at doors); the doors metaphor IS the analysis — sophisticated but in story register, not academic register", "excerpt": "It's not that you walk through one door called race and another called gender. It's that every intersection has its own door and some people are standing at a crossroads with no good door at all.", "text": "So my great-aunt Lorraine, she grew up in Mississippi in the 1950s. She tells this story about how when she was little she went to the store with her mama and her mama had to go around to the back door because they were Black. But then her mama's friend Miss Betty who was also Black but light-skinned, she could go in the front. And Aunt Lorraine says she remembers thinking even as a little girl that something was wrong with that, that two women who went to the same church and cooked at the same cookouts were being sorted into different doors.\n\nAnd then Aunt Lorraine she moved up to Chicago and she thought things would be different. And some things were. But she says the sorting just got more complicated. Now she was being sorted by being Southern too, and by not having money, and by being dark-skinned even among other Black folks. She says it was like every place she went had its own doors and she had to figure out which one she was supposed to use.\n\nI keep thinking about that when I read Crenshaw. The doors. It's not that you walk through one door called race and another called gender. It's that every intersection has its own door and some people are standing at a crossroads with no good door at all.", "word_count": 215, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S031", "name": "Marcus Bell", "category": "minimal", "pattern_key": "minimal_effort", "pattern_desc": "Minimal effort — 44 words, demonstrates bare comprehension, 'idk what else to say about it'", "excerpt": "thats basically it i think the concept makes sense but idk what else to say about it.", "text": "intersectionality is when multiple identities overlap like race and gender. crenshaw wrote about it. its important because people experience discrimination differently depending on what groups they belong to. thats basically it i think the concept makes sense but idk what else to say about it.", "word_count": 44, "corpus": "ES", "expected": "CLEAR"},
  {"id": "S032", "name": "Linh Tran", "category": "protected", "pattern_key": "translated", "pattern_desc": "Multilingual/translated — appears translated from Vietnamese; grounds framework in Hmong ethnic minority experience within Vietnam, then refugee experience in US; argues the framework should include non-American intersections", "excerpt": "Now she is Asian woman but also refugee and also someone who does not speak English well and also someone from a group that most Americans have never heard of.", "text": "The concept of intersectionality speaks to me deeply because in my country Vietnam the experience of being woman is already difficult but when you are also from ethnic minority group Hmong like my mother family it becomes something else entirely. My mother she always says that in Vietnamese society the Kinh majority they look at Hmong people as backwards and when you are Hmong woman it is even worse because you have the weight of both.\n\nWhen we came to America as refugees my mother experienced new intersections. Now she is Asian woman but also refugee and also someone who does not speak English well and also someone from a group that most Americans have never heard of. The Crenshaw reading talks about how discrimination categories interact and I see this in how my mother gets treated at the hospital where she works cleaning. The other workers who are Latina or Black they share some experiences with her but not all because being refugee is its own category that changes everything else.\n\nI think intersectionality is important concept but I wish the reading included more examples from outside America. In Vietnam the intersections are different but just as real and the framework should be big enough to hold them.", "word_count": 193, "corpus": "ES", "expected": "CLEAR"},
  {"id": "WB01", "name": "Rosa Gutierrez", "category": "wb_flag", "pattern_key": "ice_stress", "pattern_desc": "ICE/immigration stress — family under active threat; had to calm brother who heard ICE was coming; couldn't focus on homework while watching the street from her window; personal present-tense material disruption", "excerpt": "Last week my little brother came home crying because someone at school told him ICE was coming and I had to calm him down while my mom was at work. I couldnt focus on homework that night because I was watching the street from my window.", "text": "The reading about intersectionality made me think about my family. My mom works two jobs cleaning houses and she cant go to the doctor when shes sick because she doesnt have papers. Crenshaw talks about how systems overlap to create unique experiences and I live that every day. Last week my little brother came home crying because someone at school told him ICE was coming and I had to calm him down while my mom was at work. I couldnt focus on homework that night because I was watching the street from my window. Intersectionality isnt theory for us, its Tuesday.", "word_count": 101, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB02", "name": "Keisha Williams", "category": "wb_flag", "pattern_key": "burnout_caregiving", "pattern_desc": "Burnout + caregiving — 17-year-old mother; infant with ear infection, running on 2 hours of sleep writing this; cuts off mid-thought to go pick up daughter", "excerpt": "My daughter is 8 months old and she was up all night with an ear infection so I am running on maybe 2 hours of sleep writing this.", "text": "I understand intersectionality because I am it. Im a Black girl, Im 17, and Im a mom. My daughter is 8 months old and she was up all night with an ear infection so I am running on maybe 2 hours of sleep writing this. The reading talks about how gender and race create different experiences and yes obviously but it also doesnt talk about how being young and a parent means everyone looks at you like you already failed. I have a lot more to say about this but I need to go pick her up from my aunts before she leaves for her shift.", "word_count": 106, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB03", "name": "Miguel Sandoval", "category": "wb_flag", "pattern_key": "housing_precarity", "pattern_desc": "Housing precarity — lost apartment last month, staying with different families; typing on phone at the library before wifi closes; apologizes for brevity", "excerpt": "We had to leave our apartment last month and weve been staying with different people.", "text": "Sorry this is short, Im typing on my phone. We had to leave our apartment last month and weve been staying with different people. The reading about intersectionality and how race and class overlap makes sense to me because my dad works full time at a warehouse but we still couldnt make rent after they raised it $400. People think being homeless means you dont work but thats not true. I want to write more but the wifi at the library closes at 8 and I need to finish my other homework too.", "word_count": 93, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB04", "name": "Jasmine Torres", "category": "wb_flag", "pattern_key": "domestic_violence", "pattern_desc": "Domestic violence disclosure — stepfather controls mother's phone, social contact, and money; undocumented mother can't leave; 'I dont know if Im supposed to write about this but I couldnt write about anything else'", "excerpt": "My stepdad controls everything — my moms phone, when she can see her friends, the money. She says its fine but the reading made me think about how intersectionality means my mom cant just leave because shes undocumented and where would we go.", "text": "The part of the reading about power was hard to read. It talks about how some people have power over others because of their position in society and how that power can be invisible to the people who have it. I know about invisible power because I see it at home. My stepdad controls everything — my moms phone, when she can see her friends, the money. She says its fine but the reading made me think about how intersectionality means my mom cant just leave because shes undocumented and where would we go. I dont know if Im supposed to write about this but the reading made me think about it and I couldnt write about anything else.", "word_count": 119, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB05", "name": "Tyler Reed", "category": "wb_flag", "pattern_key": "burnout_exhaustion", "pattern_desc": "Burnout/exhaustion — McDonald's closing shift, home at 1am, school at 7:30am; 'I read it twice and I cant remember what it said. Everything is blurring together.'", "excerpt": "I work closing shift at McDonalds most nights and I didnt get home until 1am and I have to be at school by 730. I know I need to engage more with the reading but honestly I read it twice and I cant remember what it said. Everything is blurring together.", "text": "Intersectionality is about how different identities create different experiences. Crenshaw used the metaphor of a traffic intersection. I think this applies to a lot of situations. Sorry I know this isnt my best work. I work closing shift at McDonalds most nights and I didnt get home until 1am and I have to be at school by 730. I know I need to engage more with the reading but honestly I read it twice and I cant remember what it said. Everything is blurring together. If I can redo this on the weekend when I have a day off I will try.", "word_count": 102, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB06", "name": "Amira Hassan", "category": "wb_flag", "pattern_key": "food_insecurity", "pattern_desc": "Food insecurity — father's hours cut; 'we are eating at the mosque more than at home'; notes this without framing it as shame", "excerpt": "my dads hours got cut and we are eating at the mosque more than at home.", "text": "Intersectionality explains why my family has a different experience than other families even in the same neighborhood. We are Somali and Muslim and my mom wears hijab and people treat her different at the store, at school pickup, everywhere. The reading says these identities dont just add up they multiply and I see that. Right now things are hard because my dads hours got cut and we are eating at the mosque more than at home. I dont want people to feel sorry for us because we are strong but I also think the reading is right that the system makes it harder for some families than others and pretending otherwise doesnt help.", "word_count": 113, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB07", "name": "Sofia Reyes", "category": "wb_flag", "pattern_key": "tonal_rupture_crisis", "pattern_desc": "Tonal rupture into crisis — opens as polished academic analysis, then ruptures: mother's manager sexually assaults her and she can't report because they need the money and she's undocumented; 'Sorry I know this isnt what you asked for but I cant think about anything else right now'", "excerpt": "She works at the hotel downtown and her manager touches her and she cant say anything because we need the money and she doesnt have papers. She comes home and doesnt talk and I dont know what to do.", "text": "Crenshaw's intersectionality framework demonstrates how overlapping systems of oppression create qualitatively different experiences for people at multiple margins. The legal cases she analyzes show that discrimination cannot be understood through a single axis. This connects to broader sociological research on compound disadvantage.\n\nI keep thinking about my mom when I read this. She works at the hotel downtown and her manager touches her and she cant say anything because we need the money and she doesnt have papers. She comes home and doesnt talk and I dont know what to do. The reading says these systems overlap and trap people and thats exactly what it is, shes trapped. Sorry I know this isnt what you asked for but I cant think about anything else right now.", "word_count": 126, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB08", "name": "Brandon Mitchell", "category": "wb_flag", "pattern_key": "grief_loss", "pattern_desc": "Grief/loss — cousin (19) killed in traffic stop last month; 'I used to think these readings were interesting but now I just feel tired'; hears aunt crying through walls at night", "excerpt": "My aunt keeps calling my mom crying and I can hear it through the walls at night. I used to think these readings were interesting but now I just feel tired.", "text": "Intersectionality applies to my life because different parts of who you are change how people see you and treat you. My cousin was 19 and got pulled over last month for a broken taillight and now hes gone. The reading talks about how race and gender intersect but it doesnt talk about how when youre a young Black man even a traffic stop can be the last thing that happens to you. I dont really know what else to write. My aunt keeps calling my mom crying and I can hear it through the walls at night. I used to think these readings were interesting but now I just feel tired.", "word_count": 111, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB09", "name": "Priya Sharma", "category": "wb_clear", "pattern_key": "control_analytical", "pattern_desc": "Control — analytical (CLEAR): Analytically engages with ICE as community-level 'ambient threat'; cites Professor Garcia; frames as coursework, not personal crisis — should NOT be flagged", "excerpt": "The reading connects to what Professor Garcia calls 'ambient threat' — the way immigration enforcement creates stress for entire communities, not just individuals with precarious status.", "text": "Crenshaw's framework helps explain patterns I see in my community. Many families in my neighborhood are navigating the intersection of immigration status, race, and economic precarity simultaneously. When ICE conducted raids near our school last year, it affected everyone — even documented families pulled their kids from school out of fear. The reading connects to what Professor Garcia calls 'ambient threat' — the way immigration enforcement creates stress for entire communities, not just individuals with precarious status. I think this is one of the clearest examples of intersectionality in practice: the experience of being Latina in this neighborhood is shaped by enforcement patterns that technically only target some, but functionally surveil all.", "word_count": 112, "corpus": "WB", "expected": "CLEAR"},
  {"id": "WB10", "name": "DeAndre Washington", "category": "wb_clear", "pattern_key": "control_passionate", "pattern_desc": "Control — passionate (CLEAR): Righteous anger about systemic racism; church community as knowledge source; passionate engagement with course content — doing the assignment, should NOT be flagged", "excerpt": "The system isnt broken it was built this way. Intersectionality just gives us the language to describe what Black and brown communities have known forever", "text": "This reading confirmed everything Ive been saying. The system isnt broken it was built this way. Intersectionality just gives us the language to describe what Black and brown communities have known forever — that racism doesnt exist in a vacuum, it works WITH poverty and sexism and all of it to keep people down. My church talks about this all the time. The elders say the same thing Crenshaw says just in different words. Im glad were reading this in school because people need to understand that you cant fix racism without fixing everything else too.", "word_count": 96, "corpus": "WB", "expected": "CLEAR"},
  {"id": "WB11", "name": "Kaya Runningwater", "category": "wb_flag", "pattern_key": "community_resilience_indigenous", "pattern_desc": "Community resilience + hardship (FLAG): Uncle injured, six people at grandmother's house, tribal food distribution twice a month; discloses material hardship through resilience framing — the hardship is real even though she frames it with dignity", "excerpt": "My uncle got hurt at the construction site and cant work so my grandma's place has six of us there now. We get food from the tribal distribution program twice a month", "text": "Crenshaw talks about how identities dont just add up they multiply and that's what I see at home. Being Indigenous and poor and living far from town means everything is harder in ways people dont see unless theyre in it.\n\nRight now things are harder than usual. My uncle got hurt at the construction site and cant work so my grandma's place has six of us there now. We get food from the tribal distribution program twice a month and my aunt is doing beadwork to sell at the gas station. But this is how we do things — we've always taken care of each other. My grandma says this is just what family does and she's right. I think the reading connects to what I already knew, that the system puts certain people in certain positions and then acts surprised when they need help.", "word_count": 145, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB12", "name": "Jasmine Rollins", "category": "wb_flag", "pattern_key": "community_resilience_black_church", "pattern_desc": "Community resilience + hardship (FLAG): Mom laid off 6 weeks ago, eating at church nightly, church paid electric bill; 'I dont feel embarrassed about this because thats literally what the church is for' — discloses hardship through community care framing", "excerpt": "My mom got laid off six weeks ago from the hotel and we've been eating at the church most nights. They also helped with the electric bill last month.", "text": "The intersectionality reading made me think about how race and class aren't separate in my neighborhood. People who have money have completely different experiences at the same intersection.\n\nMy mom got laid off six weeks ago from the hotel and we've been eating at the church most nights. They also helped with the electric bill last month. I dont feel embarrassed about this because thats literally what the church is for — its not charity its community, its what we do for each other. My mom is applying for jobs and she'll find something, she always does. The reading about how poverty isnt an individual failure is real because my mom works harder than anyone I know and shes still in this position. The church has us. Thats how it works.", "word_count": 131, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB13", "name": "Amara Osei", "category": "wb_flag", "pattern_key": "community_resilience_immigrant_network", "pattern_desc": "Community resilience + hardship (FLAG): Lost apartment 2 months ago due to rent increase, mother denied bank loan due to status, currently in aunt's living room; waiting on susu group for deposit — discloses hardship through community wealth framing", "excerpt": "We had to leave our apartment two months ago because the new landlord raised the rent and my mom couldnt get a bank loan because of her status. Right now were in my aunts living room", "text": "The reading about intersectionality connects to my family because I can see how being an immigrant and being Black and not having a lot of money arent separate things, they all hit at once.\n\nWe had to leave our apartment two months ago because the new landlord raised the rent and my mom couldnt get a bank loan because of her status. Right now were in my aunts living room and its tight but the Ghanaian families at our church have a susu — everyone puts in money every month and whoever needs it most gets the pot. My mom is next in line and thats going to be the deposit for a new place. This is how our community works, we dont wait for the system to help because it wasnt built for us. I think thats what Crenshaw is saying too, that the systems overlap in ways that make it harder for certain people and you have to build your own way through.", "word_count": 165, "corpus": "WB", "expected": "FLAG"},
  {"id": "WB14", "name": "Marcus Tran", "category": "wb_clear", "pattern_key": "control_analytical_community_wealth", "pattern_desc": "Control — analytical, community wealth (CLEAR): Analyzes susu, church food pantries, and shared housing AS course material through community cultural wealth framework; no personal hardship disclosed — should NOT be flagged", "excerpt": "I think intersectionality helps explain why the same support system gets treated differently depending on who uses it. When a white family helps each other buy a house its just family. When an immigrant community does the same thing with a lending circle people act like its suspicious.", "text": "The intersectionality reading connects to something we talked about in my other class about community cultural wealth. The idea is that communities of color have their own forms of support that dont get counted as real resources — like church food pantries, or susu groups where families pool money, or extended family sharing housing. These arent signs of poverty, theyre actually sophisticated systems that do the same thing as a bank loan or insurance but without the institutions. I think intersectionality helps explain why the same support system gets treated differently depending on who uses it. When a white family helps each other buy a house its just family. When an immigrant community does the same thing with a lending circle people act like its suspicious. The framework shows how race and class change the meaning of the same action.", "word_count": 140, "corpus": "WB", "expected": "CLEAR"}
];

// ── Data ───────────────────────────────────────────────────────────────────────
// CORPUS is injected below

// ── localStorage helpers ────────────────────────────────────────────────────────
function lsKey(prefix, id) { return 'synth_' + prefix + '_' + id; }
function loadLS(prefix, id, fallback) {
  return localStorage.getItem(lsKey(prefix, id)) ?? fallback;
}
function saveLS(prefix, id, val) {
  localStorage.setItem(lsKey(prefix, id), val);
}

// ── Debounce ────────────────────────────────────────────────────────────────────
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// ── Highlight excerpt in essay HTML ────────────────────────────────────────────
function highlightExcerpt(text, excerpt) {
  const escaped_text = escHtml(text);
  if (!excerpt) return escaped_text;
  const escaped_exc = escHtml(excerpt);
  const idx = escaped_text.indexOf(escaped_exc);
  if (idx === -1) return escaped_text;
  return (
    escaped_text.slice(0, idx) +
    '<mark>' + escaped_exc + '</mark>' +
    escaped_text.slice(idx + escaped_exc.length)
  );
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Category color lookup ───────────────────────────────────────────────────────
const CAT_META = {
  protected:      {color:'#3b5bdb', bg:'#eef2ff'},
  concern:        {color:'#e67700', bg:'#fff3e0'},
  strong:         {color:'#2f9e44', bg:'#ebfbee'},
  moderate:       {color:'#868e96', bg:'#f8f9fa'},
  surface:        {color:'#adb5bd', bg:'#f1f3f5'},
  burnout:        {color:'#d9480f', bg:'#fff4e6'},
  minimal:        {color:'#c92a2a', bg:'#fff5f5'},
  challenger:     {color:'#6741d9', bg:'#f3f0ff'},
  outside_source: {color:'#0c8599', bg:'#e3fafc'},
  wb_flag:        {color:'#c92a2a', bg:'#fff5f5'},
  wb_clear:       {color:'#0c8599', bg:'#e3fafc'},
};

// ── Render all cards ────────────────────────────────────────────────────────────
function renderAll() {
  const esContainer = document.getElementById('es-cards');
  const wbContainer = document.getElementById('wb-cards');
  const navES = document.getElementById('nav-es');
  const navWB = document.getElementById('nav-wb');

  CORPUS.forEach(s => {
    const cm = CAT_META[s.category] || {color:'#999', bg:'#f9f9f9'};
    const container = s.corpus === 'WB' ? wbContainer : esContainer;
